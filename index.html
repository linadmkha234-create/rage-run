           a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function resolveCollisions(entity, prevX, prevY, solids){
    entity.onGround = false;
    entity.groundTrap = null;
    for (const p of solids){
      if (!aabbIntersect(entity, p)) continue;
      const wasAbove = (prevY + entity.h) <= p.y + 0.5;
      const wasBelow = prevY >= p.y + p.h - 0.5;
      const wasLeft = (prevX + entity.w) <= p.x + 0.5;
      const wasRight = prevX >= p.x + p.w - 0.5;

      if (wasAbove && entity.vy >= 0){
        entity.y = p.y - entity.h;
        entity.vy = 0;
        entity.onGround = true;
        entity.groundTrap = p.refTrap || null;
        if (p.refTrap && (p.refTrap.type === 'fallingPlatform' || p.refTrap.type === 'crumblingFloor')) p.refTrap.touchedThisFrame = true;
      } else if (wasBelow && entity.vy < 0){
        entity.y = p.y + p.h;
        entity.vy = 0;
      } else if (wasLeft && entity.vx > 0){
        entity.x = p.x - entity.w;
        entity.vx = 0;
      } else if (wasRight && entity.vx < 0){
        entity.x = p.x + p.w;
        entity.vx = 0;
      }
    }
  }

  function updatePlayer(dtMs){
    const prevX = player.x;
    const prevY = player.y;

    if (reverseControlsTimer > 0){
      reverseControlsTimer -= dtMs;
      if (reverseControlsTimer < 0) reverseControlsTimer = 0;
    }
    if (inputLockTimer > 0){
      inputLockTimer -= dtMs;
      if (inputLockTimer < 0) inputLockTimer = 0;
    }
    const locked = inputLockTimer > 0;
    const reversed = reverseControlsTimer > 0;
    const goLeft = locked ? false : (reversed ? input.right : input.left);
    const goRight = locked ? false : (reversed ? input.left : input.right);
    const canJump = !locked;

    const control = player.onGround ? 1 : AIR_CONTROL;
    if (goLeft && !goRight){
      player.vx -= MOVE_SPEED * 0.35 * control;
      player.facing = -1;
    } else if (goRight && !goLeft){
      player.vx += MOVE_SPEED * 0.35 * control;
      player.facing = 1;
    } else {
      player.vx *= FRICTION;
    }
    player.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, player.vx));
    if (Math.abs(player.vx) < 0.02) player.vx = 0;

    if (input.jumpPressed && player.onGround && canJump){
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      SFX.jump();
    }
    input.jumpPressed = false;

    player.vy += GRAVITY;
    if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;

    ensureGenerated(player.x + GEN_LOOKAHEAD_PX);
    updateTraps(dtMs, player);
    const solids = level.platforms.concat(getSolidTrapBoxes());

    player.x += player.vx;
    resolveCollisions(player, prevX, player.y, solids);
    player.y += player.vy;
    resolveCollisions(player, player.x, prevY, solids);

    if (player.onGround && player.groundTrap && player.groundTrap.type === 'movingPlatform'){
      player.x += player.groundTrap.dx;
    }

    if (player.x < 0) player.x = 0;

    // Remember the last spot the player stood on solid, non-collapsible
    // ground — used to revive them nearby if they buy a Continue.
    if (player.onGround && (!player.groundTrap || player.groundTrap.type === 'movingPlatform')){
      lastSafeX = player.x;
      lastSafeY = player.y;
    }

    player.trail.unshift({x:player.x + player.w/2, y:player.y + player.h/2});
    if (player.trail.length > 8) player.trail.pop();

    distance = Math.floor(player.x / 10);
    document.getElementById('distNum').textContent = distance;

    pruneBehind(player.x);
    updateFloatingTexts(dtMs);

    if (player.y > DEATH_Y){ triggerDeath('fall'); return; }
    const hitTrap = checkTrapLethalHit(player);
    if (hitTrap){ triggerDeath(hitTrap.type); return; }
    checkTrapEffectHit(player);
    checkCoinPickup(player);
  }

  // ---------- 8. Camera ----------
  function updateCamera(){
    const targetX = player.x + player.w/2 - VIEW_W/2;
    camera.x += (targetX - camera.x) * 0.15;
    camera.x = Math.max(0, camera.x);
    camera.y = 0;
  }

  // ---------- Death particles ----------
  function spawnDeathParticles(x, y){
    particles = [];
    const colors = ['#3ef6ff', '#ff2f92', '#8b5cf6'];
    for (let i=0; i<16; i++){
      const angle = (i / 16) * Math.PI * 2 + Math.random()*0.4;
      const speed = 1.2 + Math.random()*2.2;
      particles.push({
        x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 1,
        life: 1, color: colors[i % colors.length], size: 2 + Math.random()*2
      });
    }
  }
  function updateParticles(dtMs){
    const dt = dtMs/16.67;
    for (const p of particles){
      p.vy += 0.12 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 0.028 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles(){
    for (const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 5;
      ctx.fillRect(p.x - camera.x - p.size/2, p.y - camera.y - p.size/2, p.size, p.size);
      ctx.restore();
    }
  }

  // ---------- 9. Death / Restart ----------
  function triggerDeath(reason){
    if (state !== 'playing') return;
    state = 'dying';
    deathTimer = 0;
    deathReason = reason;
    SFX.hit();
    spawnDeathParticles(player.x + player.w/2, player.y + player.h/2);
  }

  function finalizeDeath(){
    state = 'dead';
    deaths++;
    if (distance > bestDistance){ bestDistance = distance; saveNum(STORAGE_KEYS.best, bestDistance); }
    rageLevel = Math.min(100, rageLevel + 22);
    SFX.death();
    document.getElementById('deathCount').textContent = deaths;
    document.getElementById('bestNum').textContent = bestDistance;

    document.getElementById('death-line').textContent = DEATH_LINES[deathReason] || DEATH_LINES.default;
    document.getElementById('finalDist').textContent = distance;
    document.getElementById('finalCoins').textContent = totalCoins;
    document.getElementById('death-msg').textContent = '';
    const continueBtn = document.getElementById('death-continue');
    continueBtn.classList.toggle('disabled', totalCoins < 900);
    document.getElementById('death-overlay').classList.add('active');
  }

  // Continue-in-place: costs 900 coins, revives the player at the last
  // safe spot they stood on (no world regeneration, no reset to 0m).
  function continueRun(){
    if (totalCoins < 900){
      document.getElementById('death-msg').textContent = 'لا تملك عملات كافية للاستمرار.';
      SFX.button();
      return;
    }
    totalCoins -= 900;
    saveCoins();
    SFX.buyHeart();

    player.x = lastSafeX; player.y = lastSafeY;
    player.vx = 0; player.vy = 0; player.trail = []; player.groundTrap = null;
    particles = [];
    floatingTexts = [];
    reverseControlsTimer = 0;
    inputLockTimer = 0;
    distance = Math.floor(player.x / 10);
    state = 'playing';

    document.getElementById('coinNum').textContent = totalCoins;
    document.getElementById('death-overlay').classList.remove('active');
  }

  document.getElementById('death-continue').addEventListener('click', continueRun);
  document.getElementById('death-restart').addEventListener('click', ()=>{ SFX.button(); startNewRun(); });

  // ---------- 10. Render ----------
  function drawBackground(){
    ctx.fillStyle = '#0a0714';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth = 1;
    const parallax = camera.x * 0.3;
    for (let i = -1; i < 8; i++){
      const gx = (i * 90) - (parallax % 90);
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, VIEW_H); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.25;
    const baseIndex = Math.floor((camera.x - 260) / 260);
    for (let k = 0; k < 8; k++){
      const worldX = (baseIndex + k) * 260 + 130;
      const by = 40 + (k % 3) * 30;
      ctx.fillStyle = k % 2 === 0 ? '#3ef6ff' : '#ff2f92';
      ctx.beginPath(); ctx.arc(worldX - camera.x, by, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlatforms(){
    for (const p of level.platforms){
      const sx = p.x - camera.x, sy = p.y - camera.y;
      if (sx + p.w < 0 || sx > VIEW_W) continue;
      ctx.fillStyle = '#1c1230';
      ctx.fillRect(sx, sy, p.w, p.h);
      let edgeColor = p.type === 'start' ? '#3ef6ff' : '#8b5cf6';
      ctx.fillStyle = edgeColor;
      ctx.fillRect(sx, sy, p.w, 2);
      ctx.save();
      ctx.shadowColor = edgeColor; ctx.shadowBlur = 6;
      ctx.fillRect(sx, sy, p.w, 2);
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(sx, sy + p.h - 4, p.w, 4);
    }
  }

  function drawPlayer(){
    if (state === 'dying' || state === 'dead') return;
    const sx = player.x - camera.x, sy = player.y - camera.y;
    for (let i = player.trail.length - 1; i >= 0; i--){
      const t = player.trail[i];
      const alpha = (1 - i / player.trail.length) * 0.25;
      ctx.fillStyle = `rgba(62,246,255,${alpha})`;
      ctx.fillRect(t.x - camera.x - 2, t.y - camera.y - 2, 4, 4);
    }
    ctx.save();
    ctx.translate(sx + player.w/2, sy + player.h/2);
    ctx.scale(player.facing, 1);
    const reversedTint = reverseControlsTimer > 0;
    const lockedTint = inputLockTimer > 0;
    const tintColor = lockedTint ? '#ffb02e' : (reversedTint ? '#ff2f92' : '#3ef6ff');
    ctx.save();
    ctx.shadowColor = tintColor; ctx.shadowBlur = 8;
    ctx.fillStyle = '#141026';
    ctx.beginPath();
    ctx.moveTo(0, -player.h/2);
    ctx.lineTo(player.w/2, -2);
    ctx.lineTo(player.w/2 - 3, player.h/2);
    ctx.lineTo(-(player.w/2 - 3), player.h/2);
    ctx.lineTo(-player.w/2, -2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = lockedTint ? '#ffb02e' : (reversedTint ? '#ff2f92' : '#8b5cf6'); ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    ctx.fillStyle = tintColor;
    ctx.shadowColor = tintColor; ctx.shadowBlur = 6;
    ctx.fillRect(1, -4, 4, 2);
    ctx.restore();
  }

  function render(){
    drawBackground();
    drawPlatforms();
    drawCoins();
    drawTraps();
    drawPlayer();
    drawParticles();
    drawFloatingTexts();
  }

  // ---------- 11. Game loop ----------
  let lastTime = performance.now();
  function loop(now){
    const dtMs = Math.min(32, now - lastTime);
    lastTime = now;

    if (state === 'playing'){
      updatePlayer(dtMs);
      if (state === 'playing') updateCamera();
    } else if (state === 'dying'){
      deathTimer += dtMs;
      updateParticles(dtMs);
      if (deathTimer >= DEATH_ANIM_MS) finalizeDeath();
    } else if (state === 'dead'){
      updateParticles(dtMs);
    }
    // 'paused' (shop/settings open): skip all updates, just keep rendering.

    updateRageMeter(dtMs);
    render();
    requestAnimationFrame(loop);
  }

  loadCoins();
  loadHearts();
  loadAudioSettings();
  bestDistance = loadNum(STORAGE_KEYS.best, 0);
  startNewRun();
  requestAnimationFrame(loop);

  // ---------- 12. UI wiring: shop, settings, game-over, hearts ----------
  function openOverlay(id){
    SFX.button();
    document.getElementById(id).classList.add('active');
    if (state === 'playing') state = 'paused';
  }
  function closeOverlay(id){
    document.getElementById(id).classList.remove('active');
    if (state === 'paused') state = 'playing';
  }

  document.getElementById('shop-btn').addEventListener('click', ()=>{
    document.getElementById('shopCoins').textContent = totalCoins;
    document.getElementById('shop-msg').textContent = '';
    openOverlay('shop-overlay');
  });
  document.getElementById('shop-close').addEventListener('click', ()=>{ SFX.button(); closeOverlay('shop-overlay'); });
  document.getElementById('shop-buy-heart').addEventListener('click', ()=>{ buyHeart('shop-msg'); });

  document.getElementById('settings-btn').addEventListener('click', ()=> openOverlay('settings-overlay'));
  document.getElementById('settings-close').addEventListener('click', ()=>{ SFX.button(); closeOverlay('settings-overlay'); });

  document.getElementById('toggle-music').addEventListener('click', function(){
    musicEnabled = !musicEnabled;
    this.textContent = musicEnabled ? 'ON' : 'OFF';
    this.classList.toggle('off', !musicEnabled);
    saveAudioSettings();
    if (musicEnabled) startMusic(); else stopMusic();
    SFX.button();
  });
  document.getElementById('toggle-sfx').addEventListener('click', function(){
    sfxEnabled = !sfxEnabled;
    this.textContent = sfxEnabled ? 'ON' : 'OFF';
    this.classList.toggle('off', !sfxEnabled);
    saveAudioSettings();
    if (sfxEnabled) SFX.button();
  });

  // Reflect loaded settings in the toggle buttons on first paint.
  (function initUI(){
    const mBtn = document.getElementById('toggle-music');
    const sBtn = document.getElementById('toggle-sfx');
    mBtn.textContent = musicEnabled ? 'ON' : 'OFF'; mBtn.classList.toggle('off', !musicEnabled);
    sBtn.textContent = sfxEnabled ? 'ON' : 'OFF'; sBtn.classList.toggle('off', !sfxEnabled);
  })();

  // Exposed only for automated testing harnesses; harmless in normal play.
  window.__RAGE_RUN_API__ = { computeMaxGapForDy, getDifficultyParams, hashSeedString, mulberry32 };

})();
</script>
